[project]
name = "indiapins"
version = "1.1.0"
description = "Python package for mapping pins to the place where it belong"
readme = "README.rst"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Pawan Kumar Jain", email = "pawanjain.432@gmail.com" },
]
keywords = ["indiapins", "india", "pincodes", "zipcodes"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "click>=8.3.1",
    "geodistpy",
]

[project.scripts]
indiapins = "indiapins.cli:main"

[project.urls]
Homepage = "https://github.com/pawangeek/indiapins"
Repository = "https://github.com/pawangeek/indiapins"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "indiapins/",
    "LICENSE",
    "README.rst",
    "HISTORY.rst",
    "AUTHORS.rst",
    "CONTRIBUTING.rst",
]

[tool.hatch.build.targets.wheel]
packages = ["indiapins"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "flake8>=7.3.0",
    "coverage>=7.13.4",
    "twine>=6.2.0",
    "bump2version>=1.0.1",
    "zensical>=0.0.23",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flake8]
exclude = ["docs"]
max-line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
