[project]

site_name = "Indiapins"
site_description = "Python package for validating Indian pincodes and fetching location details, districts, and coordinates."
site_author = "Pawan Kumar Jain"
site_url = "https://pawangeek.github.io/indiapins/"
copyright = """
Copyright &copy; 2021-2026 Pawan Kumar Jain. Licensed under MIT.
"""

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "Core Usage" = "usage-core.md" },
  { "Geospatial Usage" = "usage-geo.md" },
  { "Contributing" = "contributing.md" },
  { "Changelog" = "changelog.md" },
]

repo_url = "https://github.com/pawangeek/indiapins"
repo_name = "pawangeek/indiapins"
edit_uri = "https://github.com/pawangeek/indiapins/edit/master/docs/"

extra_css = [
  "assets/stylesheets/extra.css",
]

[project.extra]
homepage = "https://github.com/pawangeek/indiapins"

[project.theme]
language = "en"
custom_dir = "overrides"
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pawangeek"
name = "Pawan on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://in.linkedin.com/in/pawan-jain"
name = "Pawan on LinkedIn"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/indiapins/"
name = "Indiapins on PyPI"
